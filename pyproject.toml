[project]
name = "diaggpsd"
version = "2026.11.8.post1"
description = "Live GNSS from a Qualcomm modem's DIAG stream — serves gpsd clients and writes RINEX"
license = "Apache-2.0"
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "Luke Jenkins" }]
keywords = ["diag", "modem", "cellular", "baseband", "lte", "5g", "gnss", "gps", "rinex", "nmea"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Telecommunications Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications",
    "Topic :: System :: Hardware",
    "Topic :: Scientific/Engineering :: GIS",
]
# Hard, import-time dependencies — both inward edges to already-public siblings:
#   - diagmunge: the DIAG transport core (DiagClient + DIAG_LOG_F), imported at
#     module scope in diaggpsd.py / diag_setup.py / dump_pos_report.py and via
#     diagmunge.munge.replay in dlf_to_jsonl.py.
#   - diaggrok:  the GNSS log-record parsers, imported at module scope through
#     the gnss_packets.py re-export shim.
# Edge direction is inward-only: diaggpsd -> {diagmunge, diaggrok}. Never the
# reverse. Bare PyPI names, each floored at the sibling release this package's
# full suite was verified against in an isolated venv; PyPI
# rejects direct-URL deps. Release order: diaggrok and diagmunge must be on
# PyPI before this package is uploaded.
dependencies = [
    "diaggrok>=2026.11.8",
    "diagmunge>=2026.11.8",
]

[project.optional-dependencies]
# The live AT-port path (at.py) imports pyserial lazily, inside the serial
# adapter constructor — only talking to a real modem's AT port needs it. DIAG
# capture, replay, decode, RINEX, and the gpsd server are all pyserial-free.
# pyserial IS on PyPI, so it stays a bare name.
serial = ["pyserial"]

[project.scripts]
# The live daemon: DIAG -> gpsd JSON server (+ optional RINEX).
diaggpsd = "diaggpsd.diaggpsd:main"
# Offline tooling shipped alongside the daemon.
diaggpsd-diag-setup = "diaggpsd.diag_setup:main"
diaggpsd-dlf-to-jsonl = "diaggpsd.dlf_to_jsonl:main"
diaggpsd-dump-pos-report = "diaggpsd.dump_pos_report:main"
diaggpsd-gnss-compare = "diaggpsd.gnss_compare:main"

[project.urls]
Homepage = "https://github.com/lukejenkins/diaggpsd"
Source = "https://github.com/lukejenkins/diaggpsd"
Changelog = "https://github.com/lukejenkins/diaggpsd/releases"

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

# The modules live flat in the source tree beside each other; the public carve
# packages them under src/diaggpsd/ so a pip install adds one top-level name
# (`diaggpsd`), not twelve generic ones like `at` and `nmea`. `gnss_packets`
# is a thin re-export shim over the diaggrok parsers.
[tool.setuptools.packages.find]
where = ["src"]
